<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Register - Online Voting</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #141e30, #243b55);
    font-family: 'Segoe UI', sans-serif;
}

.navbar {
    position: absolute;
    top: 0;
    width: 100%;
}

.register-card {
    margin: 100px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 25px;
    width: 420px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.37);
    border: 1px solid rgba(255,255,255,0.18);
    color: white;
}

.form-control {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
}

.form-control:focus {
    background: rgba(255,255,255,0.3);
    color: white;
    box-shadow: none;
}

.form-control::placeholder {
    color: rgba(255,255,255,0.75);
}

.btn-primary {
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    border: none;
    border-radius: 25px;
}

h3 {
    text-align: center;
    margin-bottom: 25px;
}

.mb-3 {
    margin-bottom: 12px !important;
}

video, canvas {
    width: 100%;
    border-radius: 12px;
    background: black;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand mb-0 h1">🗳 Online Voting</span>
    <a href="login.html" class="btn btn-outline-light">Login</a>
</nav>

<div class="register-card">
    <h3>Voter Registration</h3>

    <form id="registerForm">

        <div class="mb-3">
            <label>Full Name</label>
            <input type="text" id="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Aadhaar Number</label>
            <input type="text" id="aadhaarNo" maxlength="12" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Mobile Number</label>
            <input type="text" id="mobile" maxlength="10" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" id="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" id="password" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Date of Birth</label>
            <input type="date" id="dob" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">
            Register & Capture Face
        </button>
    </form>
</div>

<!-- CAMERA MODAL -->
<div class="modal fade" id="cameraModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white">

      <div class="modal-header">
        <h5 class="modal-title">Live Face Capture</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body text-center">

        <p>Please look straight into the camera and capture your face.</p>

        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>

        <img id="previewImage" style="display:none; width:100%; border-radius:12px; margin-top:10px;">

      </div>

      <div class="modal-footer">
        <button onclick="captureFace()" class="btn btn-warning w-100">
            Capture Face
        </button>

        <button id="submitBtn" onclick="submitRegistration()" class="btn btn-success w-100" style="display:none;">
            Submit Registration
        </button>
      </div>

    </div>
  </div>
</div>

<script>
let capturedBlob = null;
let cameraStream = null;
let cameraModal;

// REGISTER FORM VALIDATION
document.getElementById("registerForm").addEventListener("submit", function(e){

    e.preventDefault();

    const aadhaar = document.getElementById("aadhaarNo").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const dob = document.getElementById("dob").value;
    const password = document.getElementById("password").value;

    if(aadhaar.length !== 12 || isNaN(aadhaar)){
        alert("Aadhaar must be 12 digits");
        return;
    }

    if(mobile.length !== 10 || isNaN(mobile)){
        alert("Mobile must be 10 digits");
        return;
    }

    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
    if(!passwordRegex.test(password)){
        alert("Password must be at least 8 characters with 1 uppercase, 1 lowercase, 1 digit and 1 special character");
        return;
    }

    const today = new Date();
    const birthDate = new Date(dob);

    let age = today.getFullYear() - birthDate.getFullYear();
    const monthDiff = today.getMonth() - birthDate.getMonth();

    if(monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())){
        age--;
    }

    if(age < 18){
        alert("You are not eligible for voting. Thank you.");
        return;
    }

    openCameraModal();
});


// OPEN CAMERA MODAL
function openCameraModal(){

    cameraModal = new bootstrap.Modal(document.getElementById("cameraModal"));
    cameraModal.show();

    navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
        cameraStream = stream;
        document.getElementById("video").srcObject = stream;
    })
    .catch(err => {
        alert("Camera permission denied or camera not available");
        console.log(err);
    });
}


// CAPTURE FACE
function captureFace(){

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const previewImage = document.getElementById("previewImage");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(function(blob){
        capturedBlob = blob;

        const imageUrl = URL.createObjectURL(blob);
        previewImage.src = imageUrl;
        previewImage.style.display = "block";

        document.getElementById("submitBtn").style.display = "block";

        alert("Face captured successfully");

    }, "image/jpeg", 0.95);
}


// SUBMIT REGISTRATION
function submitRegistration(){

    if(capturedBlob === null){
        alert("Please capture face first");
        return;
    }

    let formData = new FormData();

    formData.append("aadhaarNo", document.getElementById("aadhaarNo").value.trim());
    formData.append("name", document.getElementById("name").value.trim());
    formData.append("mobile", document.getElementById("mobile").value.trim());
    formData.append("email", document.getElementById("email").value.trim());
    formData.append("password", document.getElementById("password").value);
    formData.append("dob", document.getElementById("dob").value);

    // same backend field name: photo
    formData.append("photo", capturedBlob, "face_capture.jpg");

    fetch("/api/voter/register", {
        method: "POST",
        body: formData
    })
    .then(res => res.text())
    .then(data => {

        alert(data);

        if(data.includes("Successful")){

            stopCamera();

            cameraModal.hide();

            window.location.href = "login.html";
        }

    })
    .catch(err => {
        console.log(err);
        alert("Registration failed");
    });
}


// STOP CAMERA
function stopCamera(){

    if(cameraStream){
        cameraStream.getTracks().forEach(track => track.stop());
    }
}

document.getElementById("cameraModal").addEventListener("hidden.bs.modal", function(){
    stopCamera();
});
</script>

</body>
</html>
