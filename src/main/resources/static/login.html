<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login - Online Voting</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="style.css">

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: 'Segoe UI', sans-serif;
}

.navbar-custom {
    background: #111;
    padding: 15px 30px;
}
.navbar-custom .navbar-brand {
    color: white;
    font-weight: bold;
}

.main-container {
    height: 85vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 30px;
    width: 380px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: white;
}

.form-control {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: white;
}
.form-control:focus {
    background: rgba(255, 255, 255, 0.3);
    color: white;
    box-shadow: none;
}

.btn-primary {
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    border: none;
    border-radius: 25px;
}

h3 {
    text-align: center;
    margin-bottom: 20px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-custom d-flex justify-content-between">
    <span class="navbar-brand">🗳️ Online Voting</span>
    <a href="register.html" class="btn btn-outline-light">Register</a>
</nav>

<div class="main-container">
<div class="login-card">

<h3>Voter Login</h3>

<form id="loginForm">

<div class="mb-3">
<label>Aadhaar Number</label>
<input type="text" id="aadhaarNo" class="form-control" required>
</div>

<div class="mb-3">
<label>Mobile Number</label>
<input type="text" id="mobile" class="form-control" required>
</div>

<button type="submit" id="otpBtn" class="btn btn-primary w-100">
    <span id="btnText">Send OTP</span>
    <span id="spinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
</button>

</form>

<!-- OTP SECTION -->
<div id="otpSection" style="display:none; margin-top:20px;">

<div class="mb-3">
<label>Enter OTP</label>
<input type="text" id="otp" class="form-control">
</div>

<button onclick="verifyOTP()" class="btn btn-primary w-100 mb-2">
Verify OTP
</button>

<button id="resendBtn" onclick="resendOTP()" class="btn btn-warning w-100">
Resend OTP
</button>

<p id="timerText" class="text-center mt-2"></p>

</div>

</div>
</div>

<script>

let aadhaarStored="";
let mobileStored="";
let resendDisabled = false;
let countdown = 30;
let timerInterval;

// ✅ SEND OTP
document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    const aadhaar = document.getElementById("aadhaarNo").value;
    const mobile = document.getElementById("mobile").value;

    // 🔥 VALIDATION
    if(aadhaar.length !== 12){
        showToast("Invalid Aadhaar", "error");
        return;
    }

    if(mobile.length !== 10){
        showToast("Invalid Mobile", "error");
        return;
    }

    aadhaarStored = aadhaar;
    mobileStored = mobile;

    // 🔥 SPINNER START
    const btnText = document.getElementById("btnText");
    const spinner = document.getElementById("spinner");

    btnText.innerText = "Sending...";
    spinner.classList.remove("d-none");

    fetch(`/api/otp/send-otp?mobile=${mobile}`,{
        method:"POST",
        credentials:"include"
    })
    .then(res=>res.text())
    .then(data=>{

        showToast(data);

        btnText.innerText = "Send OTP";
        spinner.classList.add("d-none");

        if(data.includes("Sent")){
            document.getElementById("otpSection").style.display="block";
            startTimer();
        }

    })
    .catch(err=>{
        console.log(err);

        btnText.innerText = "Send OTP";
        spinner.classList.add("d-none");
    });

});

// ✅ VERIFY OTP
function verifyOTP(){

    const otp = document.getElementById("otp").value;

    fetch(`/api/otp/verify-otp?mobile=${mobileStored}&otp=${otp}`,{
        method:"POST",
        credentials:"include"
    })
    .then(res=>res.text())
    .then(data=>{

        if(data.includes("Login Successful")){
            localStorage.setItem("aadhaarNo",aadhaarStored);
            window.location.href="face-verify.html";
        }else{
            showToast(data, "error");
        }

    });
}

// ✅ RESEND OTP
function resendOTP(){

    if(resendDisabled){
        showToast("Wait for timer", "error");
        return;
    }

    fetch(`/api/otp/send-otp?mobile=${mobileStored}`,{
        method:"POST",
        credentials:"include"
    })
    .then(res=>res.text())
    .then(data=>{
        showToast("OTP Resent Successfully");
        startTimer();
    });
}

// ✅ TIMER
function startTimer(){

    resendDisabled = true;
    countdown = 30;

    document.getElementById("resendBtn").disabled = true;

    timerInterval = setInterval(()=>{

        document.getElementById("timerText").innerText =
            "Resend available in " + countdown + " sec";

        countdown--;

        if(countdown < 0){
            clearInterval(timerInterval);
            resendDisabled = false;
            document.getElementById("resendBtn").disabled = false;
            document.getElementById("timerText").innerText = "";
        }

    },1000);
}

// ✅ TOAST
function showToast(message, type="success"){

    const toastEl = document.getElementById("liveToast");

    toastEl.className = "toast border-0";

    if(type === "success"){
        toastEl.classList.add("text-bg-success");
    }else{
        toastEl.classList.add("text-bg-danger");
    }

    document.getElementById("toastMsg").innerText = message;

    const toast = new bootstrap.Toast(toastEl);
    toast.show();
}

</script>

<!-- TOAST UI -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
  <div id="liveToast" class="toast text-bg-dark border-0">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

</body>
</html>
