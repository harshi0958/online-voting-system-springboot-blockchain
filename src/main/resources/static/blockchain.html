<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Blockchain - Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    background: linear-gradient(135deg,#141E30,#243B55);
    color:white;
    font-family:'Segoe UI';
}

/* NAVBAR */
.navbar-custom{
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
}

/* CONTAINER */
.container-box{
    padding:40px;
}

/* TABLE CARD */
.table-card{
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* TABLE */
.table{
    color:white;
}

.table thead{
    background: rgba(255,255,255,0.15);
}

.table tbody tr{
    background: rgba(255,255,255,0.05);
}

/* BUTTON EFFECT */
.btn{
    border-radius:25px;
    transition:0.3s;
}

.btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

/* HASH TEXT WRAP */
.hash-text{
    word-break: break-all;
    font-size: 12px;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark navbar-custom px-4">
    <span class="navbar-brand fs-4">⛓ Blockchain Explorer</span>

    <div class="ms-auto">
        <a href="admin-dashboard.html" class="btn btn-primary">
            ⬅ Back to Dashboard
        </a>
    </div>
</nav>

<div class="container container-box">

    <div class="table-card">

        <h3 class="text-center mb-4">Blockchain Vote History</h3>

        <div class="table-responsive">
            <table class="table table-bordered text-center">

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Hash</th>
                        <th>Previous Hash</th>
                        <th>Vote Data</th>
                    </tr>
                </thead>

                <tbody id="chainTable"></tbody>

            </table>
        </div>

    </div>

</div>

<script>

fetch("/api/admin/blockchain",{
    credentials:"include"
})
.then(res => res.json())
.then(data => {

let table = ""

data.forEach((block,index)=>{

table += `
<tr>
<td>${index}</td>
<td class="hash-text">${block.hash}</td>
<td class="hash-text">${block.previousHash}</td>
<td>${block.data}</td>
</tr>
`

})

document.getElementById("chainTable").innerHTML = table

})

</script>

</body>
</html>
