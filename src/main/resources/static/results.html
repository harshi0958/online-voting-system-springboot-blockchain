<!DOCTYPE html>
<html>
<head>

<title>Election Results</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#f4f7fb;
font-family:Segoe UI;
}

/* Header */
.header{
background:linear-gradient(135deg,#4e73df,#224abe);
color:white;
padding:25px;
text-align:center;
font-size:28px;
font-weight:bold;
letter-spacing:1px;
}

/* Card */
.result-card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

/* Winner */
.winner-box{
font-size:24px;
font-weight:bold;
color:#28a745;
margin-top:20px;
}

/* Chart */
.chart-container{
margin-top:40px;
}

</style>

</head>

<body>

<div class="header">
🏆 Election Results Dashboard
</div>

<div class="container mt-5">

<div class="result-card">

<h4 class="text-center mb-4">Party Wise Voting Results</h4>

<table class="table table-hover text-center">

<thead class="table-dark">
<tr>
<th>Party</th>
<th>Total Votes</th>
</tr>
</thead>

<tbody id="resultTable"></tbody>

</table>

<div class="text-center winner-box" id="winnerBox"></div>

<div class="chart-container">
<canvas id="voteChart"></canvas>
</div>

</div>

<div class="text-center mt-4">
<a href="admin-dashboard.html" class="btn btn-secondary">
⬅ Back to Dashboard
</a>
</div>

</div>

<script>

let chartInstance = null

function loadResults(){

fetch("/api/admin/results")
.then(res => res.json())
.then(data => {

let bjpVotes = 0
let congressVotes = 0

// Count votes by party
data.forEach(c => {

if(c.partyName === "BJP"){
    bjpVotes += c.voteCount
}
else if(c.partyName === "CONGRESS"){
    congressVotes += c.voteCount
}

})

// Party Table rows
let table = `
<tr>
<td>BJP</td>
<td>${bjpVotes}</td>
</tr>

<tr>
<td>CONGRESS</td>
<td>${congressVotes}</td>
</tr>
`

document.getElementById("resultTable").innerHTML = table


// Winner logic
let winner = ""

if(bjpVotes > congressVotes){
    winner = "🏆 Winner : BJP"
}
else if(congressVotes > bjpVotes){
    winner = "🏆 Winner : CONGRESS"
}
else{
    winner = "🤝 Result Tie"
}

document.getElementById("winnerBox").innerText = winner


// Chart
const ctx = document.getElementById("voteChart")

if(chartInstance){
chartInstance.destroy()
}

chartInstance = new Chart(ctx, {

type: "bar",

data: {
labels: ["BJP","CONGRESS"],
datasets: [{
label: "Total Votes",
data: [bjpVotes, congressVotes],
backgroundColor: [
"#ff9933",
"#19a0ff"
]
}]
},

options:{
responsive:true
}

})

})
.catch(error => console.log(error))

}

loadResults()

setInterval(loadResults,5000)

</script>

</body>
</html>
