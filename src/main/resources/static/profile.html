<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>User Profile - Online Voting</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #1f4037, #99f2c8);
    font-family: 'Segoe UI', sans-serif;
}

/* Navbar */
.navbar-custom {
    backdrop-filter: blur(10px);
    background: rgba(0, 0, 0, 0.4);
}

/* Center container */
.main-container {
    height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass Card */
.profile-card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 35px;
    width: 420px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
}

.profile-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 25px;
}

.info-label {
    font-weight: 600;
}

.badge-voted {
    background: linear-gradient(45deg, #ff512f, #dd2476);
    padding: 8px 15px;
    border-radius: 20px;
}

.badge-notvoted {
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    padding: 8px 15px;
    border-radius: 20px;
}

.btn-custom {
    border-radius: 25px;
}

</style>
</head>

<body>

<!-- 🔥 Navbar -->
<nav class="navbar navbar-dark navbar-custom px-4">
    <span class="navbar-brand mb-0 h1">
        &#128499; Online Voting
    </span>

    <div>
        <a href="vote.html" class="btn btn-outline-light me-2 btn-custom">
            Back to Vote
        </a>
        <button onclick="logout()" class="btn btn-danger btn-custom">
            Logout
        </button>
    </div>
</nav>

<!-- 🔥 Profile Card -->
<div class="main-container">
    <div class="profile-card">

        <h3 class="profile-title">👤 Voter Profile</h3>

        <p><span class="info-label">Name:</span> <span id="name"></span></p>
        <p><span class="info-label">Aadhaar:</span> <span id="aadhaar"></span></p>
        <p><span class="info-label">Mobile:</span> <span id="mobile"></span></p>
        <p><span class="info-label">Email:</span> <span id="email"></span></p>

        <p>
            <span class="info-label">Voting Status:</span>
            <span id="status"></span>
        </p>

    </div>
</div>

<script>

// 🔹 Load Profile Data
fetch("/api/voter/profile")
.then(res => res.json())
.then(data => {

    if(!data.aadhaarNo){
        alert("Please login first!");
        window.location.href = "login.html";
    }

    document.getElementById("name").innerText = data.name;
    document.getElementById("aadhaar").innerText = data.aadhaarNo;
    document.getElementById("mobile").innerText = data.mobile;
    document.getElementById("email").innerText = data.email;

    let statusElement = document.getElementById("status");

    if(data.hasVoted){
        statusElement.innerHTML =
            `<span class="badge badge-voted">Already Voted</span>`;
    } else {
        statusElement.innerHTML =
            `<span class="badge badge-notvoted">Not Voted Yet</span>`;
    }

});


// 🔹 Logout
function logout(){
    fetch("/api/voter/logout", {
        method: "POST"
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        window.location.href = "login.html";
    });
}

</script>

</body>
</html>
