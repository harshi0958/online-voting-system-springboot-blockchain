<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login - Online Voting</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    font-family: 'Segoe UI', sans-serif;
}

.navbar-custom {
    backdrop-filter: blur(10px);
    background: rgba(0, 0, 0, 0.4);
}

.main-container {
    height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 40px;
    width: 400px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
}

.form-control {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: white;
}

.form-control:focus {
    background: rgba(255, 255, 255, 0.3);
    color: white;
    box-shadow: none;
}

.btn-admin {
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    border: none;
    border-radius: 25px;
    color: white;
}
/* 🔥 COMMON BUTTON HOVER EFFECT */
button, .btn {
    transition: all 0.3s ease;
}

/* HOVER EFFECT */
button:hover, .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

/* CLICK EFFECT */
button:active, .btn:active {
    transform: scale(0.95);
}
.btn {
    border-radius: 25px;
}
.vote-toggle:hover {
    transform: scale(1.1);
    box-shadow: 0 0 10px rgba(255,255,255,0.6);
}
</style>
</head>

<body>

<nav class="navbar navbar-dark navbar-custom px-4">
    <span class="navbar-brand mb-0 h1">🔐 Admin Panel</span>
    <a href="login.html" class="btn btn-outline-light">
        Login as Voter
    </a>
</nav>

<div class="main-container">
    <div class="login-card">
        <h3 class="text-center mb-4">Admin Login</h3>

        <form id="adminLoginForm">
            <div class="mb-3">
                <label>Username</label>
                <input type="text" id="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-admin w-100 mt-3">
                Login as Admin
            </button>
        </form>
    </div>
</div>

<script>
document.getElementById("adminLoginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    fetch("/api/admin/login", {
        method: "POST",
        credentials: "include",   // 🔥 ADD THIS
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "username=" + encodeURIComponent(username) +
              "&password=" + encodeURIComponent(password)
    })
    .then(res => res.text())
    .then(data => {
        if (data === "success") {
            window.location.href = "admin-dashboard.html";
        } else {
            alert("Invalid Username or Password");
        }
    });
});
</script>

</body>
</html>
